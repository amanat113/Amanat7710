;color:var(--muted);font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid{display:grid;gap:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.nowrap{flex-wrap:nowrap}.grow{flex:1}.divider{height:1px;background:var(--line);margin:12px 0}.pill,.badge{display:inline-flex;align-items:center;justify-content:center;min-height:30px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:1000}.pill{background:#f1e8da;color:#73532f}.badge{background:#eef2ff;color:#3730a3}.badge.pending{background:#fff7ed;color:#c2410c}.badge.processing{background:#eff6ff;color:#1d4ed8}.badge.ready{background:#ecfdf5;color:#047857}.badge.partial_delivered{background:#fef3c7;color:#92400e}.badge.delivered{background:#f3f4f6;color:#374151}.order-list{display:grid;gap:10px}.order-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}.order-card.compact{padding:12px}.order-top{display:flex;gap:10px;align-items:flex-start}.order-title{font-weight:1000;font-size:16px}.card-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.card-meta span{background:#f8f5ef;border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#3b4354}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini-btn{min-height:40px;border-radius:14px;background:#f8f5ef;border:1px solid var(--line);padding:0 12px;color:var(--navy);font-weight:900}.mini-btn.primary,.mini-btn.green{background:var(--navy);color:#fff;border-color:var(--navy)}.mini-btn.green{background:var(--green);border-color:var(--green)}.empty{padding:18px;border:1px dashed #d7c9b9;border-radius:18px;color:var(--muted);text-align:center}.search-wrap{position:relative}.search-wrap input{padding-right:52px}.clear-btn{position:absolute;right:7px;top:7px;width:38px;height:38px;border-radius:14px;background:#f1f5f9;color:var(--ink);font-size:20px}.total-panel{border:1px solid var(--line);background:#fffaf0;border-radius:18px;padding:14px}.total-panel b{font-size:28px;color:var(--green)}
    .bottom-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));height:72px;background:rgba(255,253,248,.98);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 40px rgba(15,23,42,.22);border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);z-index:60;padding:8px}.nav-item{background:transparent;border-radius:20px;color:#637083;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav-item .ico{font-size:20px}.nav-item.active{color:var(--navy);background:#f4eadb}.nav-item.new{margin-top:-24px}.nav-item .circle{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 12px 25px rgba(200,155,93,.35)}.nav-item.new span:last-child{display:none}

x;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px;background:#fff}.history-item{border-bottom:1px solid var(--line);padding:10px 0}.history-item:last-child{border-bottom:0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#0b1220;color:#fff;border-radius:18px;padding:14px 18px;font-weight:900;z-index:200;width:min(620px,calc(100% - 28px));box-shadow:var(--shadow);opacity:0;transition:.18s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
  <div id="app" class="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <button id="calcFab" class="calc-fab" aria-label="Calculator">🧮</button>
  <div id="calcBox" class="calc-box hidden" aria-label="Calculator"></div>
  <script>
'use strict';
const TailorERP = (() => {
  const VERSION = 'ONE-FILE-ACODE-PRO-8.0.0';
  const SHOP_ID = 'default_shop';
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDzsK84FZkD326OUXY5W559YjJNkSWhVH8',
    authDomain: 'tailors-erp1.firebaseapp.com',
    projectId: 'tailors-erp1',
    storageBucket: 'tailors-erp1.firebasestorage.app',
    messagingSenderId: '644724160636',
    appId: '1:644724160636:web:facf50cacef44840c571f9',
    measurementId: 'G-SSTFG0E5M2'
  };
  const LS = {
    profile:'terp.profile.v8', unlock:'terp.unlock.v8', orders:'terp.orders.v8', staff:'terp.staff.v8', staffLedger:'terp.staffLedger.v8', deliveries:'terp.deliveries.v8', settings:'terp.settings.v8', calc:'terp.calc.v8'
  };
  const DEFAULT_SETTINGS = { shopName:"Tailor's ERP", address:'', phone:'', slipText:'Thank you for your order.', measurements:[], workTypes:[] };
  const state = { ready:false, auth:null, db:null, firebaseReady:false, firebaseUser:null, profile:null, unlocked:false, view:'home', drawer:false, orders:[], staff:[], staffLedger:[], deliveries:[], settings:structuredClone(DEFAULT_SETTINGS), search:{home:'',process:'',delivery:'',history:''}, selected:{processOrderId:'',deliveryOrderId:'',staffId:''}, confirmationResult:null, recaptcha:null, sendingOtp:false, calc:{open:false, display:'0', memory:0, left:null, op:null, reset:false} };
  const $ = id => document.getElementById(id);
  const app = () => $('app'); const modalRoot = () => $('modal-root');
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const clean = v => String(v ?? '').trim();
  const num = v => { const n = Number(String(v ?? '').replace(/[^0-9.-]/g,'')); return Number.isFinite(n) ? n : 0; };
  const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
  const nowISO = () => new Date().toISOString(); const todayISO = () => new Date().toISOString().slice(0,10);
  const money = v => `₹${num(v).toLocaleString('en-IN')}`;
  const fmtDate = iso => iso ? new Date(iso).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}) : '-';
  const deepClone = v => JSON.parse(JSON.stringify(v));
  const read = (k,f) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch { return f; } };
  const write = (k,v) => localStorage.setItem(k, JSON.stringify(v)); const remove = k => localStorage.removeItem(k);
  const normalizePhone = p => { const raw = clean(p); const d = raw.replace(/\D/g,''); if(raw.startsWith('+')) return `+${d}`; if(d.length===10) return `+91${d}`; if(d.length===12 && d.startsWith('91')) return `+${d}`; return `+${d}`; };
  const isValidIndianPhone = p => /^\+91[6-9]\d{9}$/.test(normalizePhone(p));
  const byDateDesc = (a,b) => String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''));
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.classList.remove('show'),3300); }
  function setView(v){ state.view=v; state.drawer=false; state.selected.processOrderId=''; state.selected.deliveryOrderId=''; render(); }
  async function sha256(text){ const data=new TextEncoder().encode(text); const digest=await crypto.subtle.digest('SHA-256',data); return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  function loadLocal(){ state.orders=read(LS.orders,[]).map(normalizeOrder).sort(byDateDesc); state.staff=read(LS.staff,[]).sort(byDateDesc); state.staffLedger=read(LS.staffLedger,[]).sort(byDateDesc); state.deliveries=read(LS.deliveries,[]).sort(byDateDesc); state.settings={...deepClone(DEFAULT_SETTINGS),...read(LS.settings,{})}; state.settings.measurements=Array.isArray(state.settings.measurements)?state.settings.measurements:[]; state.settings.workTypes=Array.isArray(state.settings.workTypes)?state.settings.workTypes:[]; state.profile=read(LS.profile,null); const u=read(LS.unlock,null); state.unlocked=Boolean(u&&state.profile&&u.uid===state.profile.uid&&Date.now()<u.validUntil); state.calc={...state.calc,...read(LS.calc,{})}; }
  function persistLocal(){ write(LS.orders,state.orders); write(LS.staff,state.staff); write(LS.staffLedger,state.staffLedger); write(LS.deliveries,state.deliveries); write(LS.settings,state.settings); }
  function normalizeOrder(order){ order=order||{}; const qty=Math.max(0,num(order.clothQty)); const existing=Array.isArray(order.items)?order.items:[]; const items=Array.from({length:qty},(_,i)=>({no:i+1,status:existing[i]?.status||'pending'})); const deliveredQty=items.filter(i=>i.status==='delivered').length; const readyQty=items.filter(i=>i.status==='ready').length; const processingQty=items.filter(i=>i.status==='processing').length; const pendingQty=items.filter(i=>i.status==='pending').length; const status=deliveredQty===qty&&qty>0?'delivered':deliveredQty>0?'partial_delivered':readyQty===qty&&qty>0?'ready':(processingQty>0||readyQty>0)?'processing':'pending'; return {...order, clothQty:qty, bill:num(order.bill), advance:num(order.advance), deliveryPaidTotal:num(order.deliveryPaidTotal), due:Math.max(0,num(order.bill)-num(order.advance)-num(order.deliveryPaidTotal)), items, deliveredQty, readyQty, processingQty, pendingQty, status}; }
  async function initFirebase(){ if(!window.firebase) { toast('Firebase library blocked. Check internet.'); return false; } try { if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); state.auth=firebase.auth(); await state.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); state.db=firebase.firestore(); state.db.enablePersistence({synchronizeTabs:true}).catch(()=>null); state.firebaseReady=true; state.auth.onAuthStateChanged(async user=>{ state.firebaseUser=user; if(user){ const saved=read(LS.profile,null); if(saved&&saved.uid===user.uid) state.profile=saved; await syncDown(); } else { state.profile=null; state.unlocked=false; } render(); }); return true; } catch(e){ toast(`Firebase error: ${e.message||e}`); return false; } }
  const collection = name => (state.db&&state.firebaseUser) ? state.db.collection('shops').doc(SHOP_ID).collection(name) : null;
  async function syncDown(){ if(!state.firebaseReady||!state.firebaseUser) return; try{ const [orders,staff,ledger,deliveries,settingsDoc]=await Promise.all([collection('orders').get(),collection('staff').get(),collection('staffLedger').get(),collection('deliveries').get(),state.db.collection('shops').doc(SHOP_ID).collection('settings').doc('main').get()]); state.orders=orders.docs.map(d=>normalizeOrder({id:d.id,...d.data()})).sort(byDateDesc); state.staff=staff.docs.map(d=>({id:d.id,...d.data()})).sort(byDateDesc); state.staffLedger=ledger.docs.map(d=>({id:d.id,...d.data()})).sort(byDateDesc); state.deliveries=deliveries.docs.map(d=>({id:d.id,...d.data()})).sort(byDateDesc); if(settingsDoc.exists){ state.settings={...deepClone(DEFAULT_SETTINGS),...settingsDoc.data()}; state.settings.measurements=Array.isArray(state.settings.measurements)?state.settings.measurements:[]; state.settings.workTypes=Array.isArray(state.settings.workTypes)?state.settings.workTypes:[]; } persistLocal(); }catch(e){ console.warn(e); } }
  async function pushDoc(name,item){ persistLocal(); if(!state.firebaseReady||!state.firebaseUser) return; const ref=collection(name); if(ref) await ref.doc(item.id).set(item,{merge:true}); }
  async function saveSettings(){ write(LS.settings,state.settings); if(state.firebaseReady&&state.firebaseUser) await state.db.collection('shops').doc(SHOP_ID).collection('settings').doc('main').set(state.settings,{merge:true}); }
  const unlockMs = role => role==='Staff'?24*60*60*1000:12*60*60*1000;
  function shell(content){ return `<div class="layout"><div class="topbar"><button class="icon-btn" id="drawerBtn">☰</button><div><h1>${esc(state.settings.shopName)}</h1><small>${esc(state.profile?.role||'')} ${state.firebaseReady?'• Cloud ready':'• Local mode'}</small></div><div class="spacer"></div><button class="icon-btn" id="syncBtn">↻</button></div>${content}</div>${drawerHtml()}${bottomNavHtml()}`; }
  function drawerHtml(){ if(!state.drawer) return ''; const items=[['home','🏠','Home'],['new','➕','New Order'],['process','✂️','Processing'],['delivery','🚚','Delivery'],['history','📦','Delivery History'],['staff','👥','Staff Ledger'],['analytics','📊','Analytics'],['settings','⚙️','Settings']]; return `<div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="drawer"><div class="brand"><div class="logo">TE</div><div><h1>${esc(state.settings.shopName)}</h1><p class="tiny">${esc(state.profile?.phone||'')}</p></div></div>${items.map(([v,i,l])=>`<button class="drawer-btn ${state.view===v?'active':''}" data-nav="${v}"><span>${i}</span>${l}</button>`).join('')}<div class="divider"></div><button class="drawer-btn" id="lockBtn">🔐 Lock with PIN</button><button class="drawer-btn danger" id="logoutBtn">↪ Logout</button><p class="tiny">Version ${VERSION}</p></aside>`; }
  function bottomNavHtml(){ const items=[['home','🏠','Home'],['process','✂️','Process'],['new','+',''],['delivery','🚚','Delivery'],['staff','👥','Staff']]; return `<nav class="bottom-nav">${items.map(([v,i,l])=>v==='new'?`<button class="nav-item new ${state.view===v?'active':''}" data-nav="${v}"><span class="circle">${i}</span><span>${l}</span></button>`:`<button class="nav-item ${state.view===v?'active':''}" data-nav="${v}"><span class="ico">${i}</span><span>${l}</span></button>`).join('')}</nav>`; }
  function authScreen(){ return `<main class="auth-page"><section class="auth-card"><div class="brand"><div class="logo">TE</div><div><h1>Tailor's ERP</h1><p>Professional tailoring management</p></div></div><div class="stack"><div class="successbox">Secure login: first-time OTP, daily use with PIN.</div><label><span class="label">Mobile Number</span><input id="loginPhone" inputmode="tel" autocomplete="tel" placeholder="10 digit mobile" /></label><label><span class="label">Role</span><select id="loginRole"><option value="">Select Role</option><option>Owner</option><option>Manager</option><option>Staff</option></select></label><button class="btn" id="sendOtpBtn">Send Real OTP</button><div id="recaptcha-host" class="recaptcha-box"></div><p class="hint muted">After first verified login, this phone opens with PIN only. Logout/new phone requires OTP again.</p></div></section></main>`; }
  function pinScreen(){ return `<main class="auth-page"><section class="auth-card"><div class="brand"><div class="logo">TE</div><div><h1>Enter PIN</h1><p>OTP is not required for daily shop use.</p></div></div><div class="stack"><label><span class="label">PIN</span><input id="pinLogin" type="password" inputmode="numeric" placeholder="4-8 digit PIN" /></label><button class="btn" id="unlockBtn">Unlock App</button><button class="btn secondary" id="logoutFromPinBtn">Logout / Use OTP Again</button></div></section></main>`; }

  function settingsView(){ return shell(`<section class="section"><div class="section-head"><h2>Shop Info</h2></div><form id="settingsForm" class="form-grid"><input name="shopName" value="${esc(state.settings.shopName)}" placeholder="Shop name"/><input name="phone" value="${esc(state.settings.phone)}" placeholder="Shop phone"/><textarea name="address" placeholder="Shop address">${esc(state.settings.address)}</textarea><textarea name="slipText" placeholder="Slip footer text">${esc(state.settings.slipText)}</textarea><button class="btn">Save Shop Info</button></form></section><section class="section"><div class="section-head"><h2>Measurement Setup</h2></div><form id="measurementForm" class="row"><input class="grow" name="label" placeholder="Example: Length"/><button class="btn gold small">Add</button></form><div class="card-meta">${state.settings.measurements.map(m=>`<span>${esc(m)} <button class="mini-btn" data-remove-measure="${esc(m)}">×</button></span>`).join('')||'<span>No fields</span>'}</div></section><section class="section"><div class="section-head"><h2>Cloth Type & Rate</h2></div><form id="workTypeForm" class="two"><input name="type" placeholder="Cloth type e.g. Shirt"/><input name="rate" inputmode="decimal" placeholder="Rate"/><button class="btn gold" style="grid-column:1/-1">Save Type Rate</button></form><div class="card-meta">${state.settings.workTypes.map(w=>`<span>${esc(w.type)} — ${money(w.rate)} <button class="mini-btn" data-remove-worktype="${esc(w.id)}">×</button></span>`).join('')||'<span>No rates</span>'}</div></section><section class="section"><div class="section-head"><h2>Backup & Reset</h2></div><div class="row"><button class="btn secondary" id="exportBackupBtn">Export JSON</button><button class="btn secondary" id="importBackupBtn">Import JSON</button><button class="btn red" id="resetDataBtn">Reset Data</button></div></section>`); }
  function analyticsView(){ const tr=state.orders.reduce((s,o)=>s+o.clothQty,0), ready=state.orders.reduce((s,o)=>s+o.readyQty+o.deliveredQty,0), del=state.orders.reduce((s,o)=>s+o.deliveredQty,0), rev=state.orders.reduce((s,o)=>s+num(o.advance)+num(o.deliveryPaidTotal),0), due=state.orders.reduce((s,o)=>s+num(o.due),0); return shell(`<section class="section"><div class="section-head"><h2>Analytics</h2></div><div class="metric-grid">${[['Clothes Received',tr],['Ready/Stitched',ready],['Delivered',del],['Revenue',money(rev)],['Due',money(due)],['Active Orders',state.orders.filter(o=>o.status!=='delivered').length]].map(([l,v])=>`<div class="metric"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div></section>`); }
  function render(){ if(!app()) return; if(!state.ready){ app().innerHTML='<main class="auth-page"><section class="auth-card"><div class="brand"><div class="logo">TE</div><div><h1>Loading</h1><p>Preparing Tailor ERP...</p></div></div></section></main>'; return; } if(!state.firebaseUser){ app().innerHTML=authScreen(); bindBaseEvents(); return; } if(!state.profile||!state.profile.pinHash||!state.unlocked){ app().innerHTML=pinScreen(); bindBaseEvents(); return; } const map={home:homeView,new:newOrderView,process:processView,delivery:deliveryView,history:historyView,staff:staffView,settings:settingsView,analytics:analyticsView}; app().innerHTML=(map[state.view]||homeView)(); bindBaseEvents(); bindViewEvents(); renderCalc(); }
  function bindBaseEvents(){ document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.nav))); $('drawerBtn')?.addEventListener('click',()=>{state.drawer=true;render();}); $('drawerBackdrop')?.addEventListener('click',()=>{state.drawer=false;render();}); $('syncBtn')?.addEventListener('click',async()=>{await syncDown();toast('Synced');render();}); $('sendOtpBtn')?.addEventListener('click',sendOtp); $('verifyOtpBtn')?.addEventListener('click',verifyOtp); $('unlockBtn')?.addEventListener('click',unlockWithPin); $('logoutFromPinBtn')?.addEventListener('click',logout); $('lockBtn')?.addEventListener('click',lockOnly); $('logoutBtn')?.addEventListener('click',logout); document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal)); document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',()=>{state.search[input.dataset.search]=input.value; quickFilter(input.dataset.search); })); document.querySelectorAll('[data-clear-search]').forEach(b=>b.addEventListener('click',()=>{state.search[b.dataset.clearSearch]='';render();})); document.querySelectorAll('[data-call]').forEach(b=>b.addEventListener('click',()=>callCustomer(b.dataset.call))); document.querySelectorAll('[data-slip]').forEach(b=>b.addEventListener('click',()=>shareSlipById(b.dataset.slip))); document.querySelectorAll('[data-open-order]').forEach(b=>b.addEventListener('click',()=>viewOrder(b.dataset.openOrder))); document.querySelectorAll('[data-edit-order]').forEach(b=>b.addEventListener('click',()=>editOrderModal(b.dataset.editOrder))); }

  async function prepareRecaptcha(){ try{ if(state.recaptcha){ try{state.recaptcha.clear();}catch{} state.recaptcha=null; } const host=$('recaptcha-host'); host.innerHTML=''; const id=`recaptcha-${Date.now()}`; const div=document.createElement('div'); div.id=id; host.appendChild(div); state.recaptcha=new firebase.auth.RecaptchaVerifier(id,{size:'invisible'}); await state.recaptcha.render(); return state.recaptcha; }catch(e){ throw new Error(e.message||String(e)); } }
  async function sendOtp(){ if(state.sendingOtp) return; const phone=normalizePhone($('loginPhone').value); const role=clean($('loginRole').value); if(!role) return toast('Please select a role.'); if(!isValidIndianPhone(phone)) return toast('Enter a valid Indian mobile number.'); if(!state.firebaseReady||!state.auth) return toast('Firebase not ready. Check internet/Firebase setup.'); const btn=$('sendOtpBtn'); try{ state.sendingOtp=true; btn.disabled=true; btn.textContent='Sending OTP...'; const verifier=await prepareRecaptcha(); state.confirmationResult=await state.auth.signInWithPhoneNumber(phone,verifier); otpModal(phone,role); }catch(e){ toast(`Firebase: ${firebaseFriendlyError(e)}`); try{state.recaptcha?.clear?.();}catch{} state.recaptcha=null; }finally{ state.sendingOtp=false; if(btn){btn.disabled=false;btn.textContent='Send Real OTP';} } }
  async function verifyOtp(){ const code=clean($('otpCode').value), pin=clean($('pinCreate').value), role=clean($('verifyOtpBtn').dataset.role); if(!/^\d{4,8}$/.test(pin)) return toast('PIN must be 4 to 8 digits.'); if(!state.confirmationResult) return toast('OTP session missing. Send OTP again.'); try{ const result=await state.confirmationResult.confirm(code); const user=result.user; const pinHash=await sha256(`${user.uid}:${pin}`); state.profile={uid:user.uid,phone:user.phoneNumber,role,pinHash,createdAt:nowISO(),updatedAt:nowISO()}; write(LS.profile,state.profile); unlockProfile(); closeModal(); await syncDown(); render(); }catch(e){ toast(`OTP failed: ${firebaseFriendlyError(e)}`); } }

  function firebaseFriendlyError(e){ const c=e?.code||''; if(c.includes('too-many-requests')) return 'Too many OTP requests. Wait before retry.'; if(c.includes('operation-not-allowed')) return 'Phone Auth or SMS region is not enabled.'; if(c.includes('invalid-phone-number')) return 'Invalid phone number.'; if(c.includes('invalid-verification-code')) return 'Invalid OTP code.'; if(String(e?.message||'').includes('already been rendered')) return 'reCAPTCHA was busy. Reload page and try once.'; return e?.message||String(e); }
  async function saveOrder(e){ e.preventDefault(); const f=e.target; const slip=clean(f.slip.value), mobile=normalizePhone(f.mobile.value), customerName=clean(f.customerName.value), clothQty=num(f.clothQty.value), bill=num(f.bill.value), advance=num(f.advance.value); if(!slip||!customerName||!clothQty) return toast('Slip, customer name and quantity are required.'); if(!isValidIndianPhone(mobile)) return toast('Enter a valid Indian mobile number.'); if(bill<=0) return toast('Total bill must be entered.'); if(advance<0||advance>bill) return toast('Advance must be between 0 and total bill.'); if(state.orders.some(o=>o.slip.toLowerCase()===slip.toLowerCase())) return toast('Duplicate slip number is not allowed.'); const measurements={}; for(const label of state.settings.measurements) measurements[label]=clean(f[`measure_${label}`]?.value||''); const order=normalizeOrder({id:uid(),slip,mobile,customerName,clothQty,bill,advance,deliveryPaidTotal:0,designUrl:clean(f.designUrl.value),measurements,items:Array.from({length:clothQty},(_,i)=>({no:i+1,status:'pending'})),timeline:[{at:nowISO(),action:'Order created'}],createdAt:nowISO(),updatedAt:nowISO(),createdBy:state.profile?.phone||''}); state.orders.unshift(order); await pushDoc('orders',order); toast('Order saved. Creating PDF slip...'); await shareSlip(order); await openWhatsApp(order.mobile,`Hello ${order.customerName}, your order (Slip: ${order.slip}) has been placed. Total: ${money(order.bill)}, Advance: ${money(order.advance)}, Due: ${money(order.due)}. Thank you!`); state.view='home'; render(); }
  async function updateItemStatus(token,status){ const [orderId,noText]=token.split(':'); const no=Number(noText); const idx=state.orders.findIndex(o=>o.id===orderId); if(idx<0)return; const order=normalizeOrder(state.orders[idx]); const item=order.items.find(x=>x.no===no); if(!item||item.status==='delivered')return toast('Delivered item cannot be changed.'); item.status=status; order.timeline=[...(order.timeline||[]),{at:nowISO(),action:`Cloth ${no} marked ${status}`}]; order.updatedAt=nowISO(); let updated=normalizeOrder(order); const allProcessing=updated.items.every(x=>['processing','ready','delivered'].includes(x.status)); const allReady=updated.items.every(x=>['ready','delivered'].includes(x.status)); if(allProcessing&&!updated.notifiedProcessing) updated.notifiedProcessing=true; if(allReady&&!updated.notifiedReady) updated.notifiedReady=true; state.orders[idx]=updated; await pushDoc('orders',updated); if(allProcessing&&updated.notifiedProcessing&&!order.notifiedProcessing) await openWhatsApp(updated.mobile,`Hello ${updated.customerName}, cutting for your order (Slip: ${updated.slip}) is complete and stitching has begun.`); if(allReady&&updated.notifiedReady&&!order.notifiedReady) await openWhatsApp(updated.mobile,`Good news ${updated.customerName}! Your clothes (Slip: ${updated.slip}) are ready for delivery.`); render(); }
  async function confirmDelivery(e){ e.preventDefault(); const f=e.target; const idx=state.orders.findIndex(o=>o.id===f.dataset.orderId); if(idx<0)return; let order=normalizeOrder(state.orders[idx]); const qty=num(f.deliverQty.value), paid=num(f.paid.value); if(order.readyQty<=0) return toast('This order is not processed yet. Complete processing before delivery.'); if(qty<=0||qty>order.readyQty)return toast('Invalid delivery quantity.'); let rem=qty; order.items=order.items.map(it=>rem>0&&it.status==='ready'?(rem--,{...it,status:'delivered'}):it); order.deliveryPaidTotal=num(order.deliveryPaidTotal)+paid; order.timeline=[...(order.timeline||[]),{at:nowISO(),action:`Delivered ${qty} cloth, paid ${money(paid)}`}]; order.updatedAt=nowISO(); order=normalizeOrder(order); state.orders[idx]=order; const delivery={id:uid(),orderId:order.id,slip:order.slip,customerName:order.customerName,mobile:order.mobile,qty,paid,dueAfter:order.due,createdAt:nowISO(),updatedAt:nowISO()}; state.deliveries.unshift(delivery); await pushDoc('orders',order); await pushDoc('deliveries',delivery); await openWhatsApp(order.mobile,`Thank you ${order.customerName}! ${qty} cloth item(s) from your order (Slip: ${order.slip}) have been delivered. Due: ${money(order.due)}.`); toast('Delivery confirmed. Fully delivered orders move to Delivery History.'); render(); }
  async function addStaff(e){ e.preventDefault(); const name=clean(e.target.name.value); if(!name)return toast('Enter staff name.'); if(state.staff.some(s=>s.name.toLowerCase()===name.toLowerCase()))return toast('Staff already exists.'); const staff={id:uid(),name,createdAt:nowISO(),updatedAt:nowISO()}; state.staff.unshift(staff); await pushDoc('staff',staff); state.selected.staffId=staff.id; render(); }
  function updateStaffTotal(){ const f=$('staffWorkForm'); if(!f)return; let total=0; for(const wt of state.settings.workTypes){ const qty=num(f.querySelector(`[data-work-qty="${CSS.escape(wt.id)}"]`)?.value); const line=qty*num(wt.rate); total+=line; const el=$(`workLine_${wt.id}`); if(el) el.textContent=money(line); } $('staffTotalPreview').textContent=money(total); }
  async function saveStaffWork(e){ e.preventDefault(); const f=e.target; const staff=state.staff.find(s=>s.id===f.dataset.staffId); if(!staff)return toast('Select staff.'); const lines=[]; let total=0; for(const wt of state.settings.workTypes){ const qty=num(f.querySelector(`[data-work-qty="${CSS.escape(wt.id)}"]`)?.value); if(qty>0){ const amount=qty*num(wt.rate); total+=amount; lines.push({type:wt.type,rate:num(wt.rate),qty,amount}); } } if(!lines.length)return toast('Select at least one work quantity.'); const paid=num(f.paid.value); if(paid<0)return toast('Paid amount cannot be negative.'); const record={id:uid(),staffId:staff.id,staffName:staff.name,date:todayISO(),lines,total,paid,balance:total-paid,summary:lines.map(x=>`${x.type} x${x.qty}`).join(', '),createdAt:nowISO(),updatedAt:nowISO()}; state.staffLedger.unshift(record); await pushDoc('staffLedger',record); toast('Staff work saved.'); render(); }
  async function saveShopInfo(e){ e.preventDefault(); const f=e.target; state.settings.shopName=clean(f.shopName.value)||"Tailor's ERP"; state.settings.phone=clean(f.phone.value); state.settings.address=clean(f.address.value); state.settings.slipText=clean(f.slipText.value); await saveSettings(); toast('Shop settings saved.'); render(); }
  async function addMeasurement(e){ e.preventDefault(); const label=clean(e.target.label.value); if(!label)return; if(state.settings.measurements.some(m=>m.toLowerCase()===label.toLowerCase()))return toast('Measurement already exists.'); state.settings.measurements.push(label); await saveSettings(); render(); }
  async function removeMeasurement(label){ state.settings.measurements=state.settings.measurements.filter(m=>m!==label); await saveSettings(); render(); }
  async function addWorkType(e){ e.preventDefault(); const type=clean(e.target.type.value), rate=num(e.target.rate.value); if(!type||rate<=0)return toast('Enter cloth type and rate.'); const existing=state.settings.workTypes.find(x=>x.type.toLowerCase()===type.toLowerCase()); if(existing) existing.rate=rate; else state.settings.workTypes.push({id:uid(),type,rate}); await saveSettings(); render(); }
  async function removeWorkType(id){ state.settings.workTypes=state.settings.workTypes.filter(x=>x.id!==id); await saveSettings(); render(); }
  function callCustomer(phone){ if(confirm(`Call customer ${phone}?`)) location.href=`tel:${phone}`; }
  async function openWhatsApp(phone,text){ window.open(`https://api.whatsapp.com/send?phone=${encodeURIComponent(normalizePhone(phone).replace('+',''))}&text=${encodeURIComponent(text)}`,'_blank','noopener'); }
  function sendStatusWhatsApp(orderId){ const o=normalizeOrder(state.orders.find(x=>x.id===orderId)); if(!o)return; const text=o.readyQty>0?`Good news ${o.customerName}! Your clothes (Slip: ${o.slip}) are ready for delivery.`:`Hello ${o.customerName}, your order (Slip: ${o.slip}) is currently ${statusText(o.status)}.`; openWhatsApp(o.mobile,text); }
  function viewOrder(orderId){ const o=normalizeOrder(state.orders.find(x=>x.id===orderId)); if(!o)return; showModal(`<div class="modal-head"><h3>Order Details</h3><div class="spacer"></div><button class="icon-btn light" data-close>×</button></div><div class="pdf-preview">${slipHtml(o)}</div><div class="card-actions"><button class="btn" data-slip="${o.id}">Share PDF</button><button class="btn secondary" data-call="${o.mobile}">Call</button></div>`); bindBaseEvents(); }
  function editOrderModal(orderId){ const o=state.orders.find(x=>x.id===orderId); if(!o)return; showModal(`<div class="modal-head"><h3>Edit Order</h3><div class="spacer"></div><button class="icon-btn light" data-close>×</button></div><form id="editOrderForm" data-id="${esc(o.id)}" class="form-grid"><input name="customerName" value="${esc(o.customerName)}" placeholder="Customer name"/><input name="mobile" value="${esc(o.mobile)}" placeholder="Mobile"/><input name="bill" value="${esc(o.bill)}" inputmode="decimal" placeholder="Bill"/><input name="advance" value="${esc(o.advance)}" inputmode="decimal" placeholder="Advance"/><button class="btn">Save Edit</button></form>`); $('editOrderForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const idx=state.orders.findIndex(x=>x.id===f.dataset.id);if(idx<0)return;let updated={...state.orders[idx],customerName:clean(f.customerName.value),mobile:normalizePhone(f.mobile.value),bill:num(f.bill.value),advance:num(f.advance.value),updatedAt:nowISO()};updated=normalizeOrder(updated);state.orders[idx]=updated;await pushDoc('orders',updated);closeModal();render();}); }
  function slipHtml(o){ const m=Object.entries(o.measurements||{}).filter(([,v])=>clean(v)).map(([k,v])=>`<div>${esc(k)}: ${esc(v)}</div>`).join('')||'<div>No measurement recorded.</div>'; return `<h2>${esc(state.settings.shopName)}</h2><div>${esc(state.settings.address)}</div><div>${esc(state.settings.phone)}</div><hr><b>Slip No:</b> ${esc(o.slip)}<br><b>Date:</b> ${fmtDate(o.createdAt)}<br><b>Customer:</b> ${esc(o.customerName)}<br><b>Mobile:</b> ${esc(o.mobile)}<br><b>Clothes:</b> ${o.clothQty}<br><b>Status:</b> ${statusText(o.status)}<hr><b>Measurements</b>${m}<hr><b>Total:</b> ${money(o.bill)}<br><b>Advance:</b> ${money(o.advance)}<br><b>Due:</b> ${money(o.due)}<hr><div>${esc(state.settings.slipText)}</div>`; }
  async function shareSlipById(id){ const o=state.orders.find(x=>x.id===id); if(o) await shareSlip(normalizeOrder(o)); }
  async function shareSlip(o){ const blob=createPdfBlob(o); const name=`Slip_${o.slip}.pdf`.replace(/[^a-zA-Z0-9_.-]/g,'_'); const file=new File([blob],name,{type:'application/pdf'}); try{ if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({title:`Order Slip ${o.slip}`,files:[file]}); else { downloadBlob(blob,name); toast('PDF downloaded. Share it from downloads.'); } }catch(e){ if(e.name!=='AbortError'){downloadBlob(blob,name);toast('PDF downloaded. Share it from downloads.');} } }
  const pdfSafe = v => String(v??'').replace(/[^\x20-\x7E]/g,'?').replace(/[()\\]/g,c=>`\\${c}`);
  function createPdfBlob(o){ const lines=[state.settings.shopName,state.settings.address,state.settings.phone?`Phone: ${state.settings.phone}`:'','----------------------------------------',`Slip No: ${o.slip}`,`Date: ${fmtDate(o.createdAt)}`,`Customer: ${o.customerName}`,`Mobile: ${o.mobile}`,`Clothes: ${o.clothQty}`,`Status: ${statusText(o.status)}`,'Measurements:'].filter(Boolean); for(const [k,v] of Object.entries(o.measurements||{})) lines.push(`  ${k}: ${v||'-'}`); lines.push('----------------------------------------',`Total Bill: ${money(o.bill)}`,`Advance: ${money(o.advance)}`,`Due: ${money(o.due)}`,'----------------------------------------',state.settings.slipText||'Thank you.'); const content=['BT','/F1 13 Tf','50 800 Td']; lines.forEach((line,i)=>{ if(i>0)content.push('0 -18 Td'); content.push(`(${pdfSafe(line)}) Tj`); }); content.push('ET'); const stream=content.join('\n'); const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`]; let pdf='%PDF-1.4\n'; const offs=[0]; objects.forEach((obj,i)=>{offs.push(pdf.length); pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;}); const xref=pdf.length; pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`; offs.slice(1).forEach(off=>pdf+=`${String(off).padStart(10,'0')} 00000 n \n`); pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`; return new Blob([pdf],{type:'application/pdf'}); }
  function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
  function exportBackup(){ downloadBlob(new Blob([JSON.stringify({version:VERSION,exportedAt:nowISO(),settings:state.settings,orders:state.orders,staff:state.staff,staffLedger:state.staffLedger,deliveries:state.deliveries},null,2)],{type:'application/json'}),`tailor_erp_backup_${todayISO()}.json`); }
  function importBackup(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json'; i.onchange=async()=>{ const file=i.files?.[0]; if(!file)return; const data=JSON.parse(await file.text()); state.settings={...deepClone(DEFAULT_SETTINGS),...(data.settings||{})}; state.orders=(data.orders||[]).map(normalizeOrder); state.staff=data.staff||[]; state.staffLedger=data.staffLedger||[]; state.deliveries=data.deliveries||[]; persistLocal(); await saveSettings(); await Promise.all(state.orders.map(o=>pushDoc('orders',o))); toast('Backup imported.'); render(); }; i.click(); }
  async function resetData(){ const pin=prompt('Owner PIN required. Enter PIN:'); if(!pin||!state.profile)return; const hash=await sha256(`${state.profile.uid}:${pin}`); if(hash!==state.profile.pinHash||state.profile.role!=='Owner') return toast('Only Owner PIN can reset data.'); if(prompt('Type CONFIRM to delete local data:')!=='CONFIRM')return; state.orders=[];state.staff=[];state.staffLedger=[];state.deliveries=[];persistLocal();toast('Local data reset.');render(); }
  function showModal(html){ modalRoot().innerHTML=`<div class="modal-layer"><div class="modal">${html}</div></div>`; bindBaseEvents(); }
  function closeModal(){ modalRoot().innerHTML=''; }
  function renderCalc(){ const box=$('calcBox'); if(!box)return; box.classList.toggle('hidden',!state.calc.open); box.innerHTML=`<div class="modal-head"><h3>Calculator</h3><div class="spacer"></div><button class="icon-btn light" id="calcClose">×</button></div><div class="calc-display">${esc(state.calc.display)}</div><div class="calc-grid">${['MC','MR','M+','C','7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'].map(k=>`<button class="calc-key ${['/','*','-','+'].includes(k)?'op':k==='='?'eq':''}" data-calc="${k}">${k}</button>`).join('')}</div>`; $('calcClose')?.addEventListener('click',()=>{state.calc.open=false;write(LS.calc,state.calc);renderCalc();}); document.querySelectorAll('[data-calc]').forEach(b=>b.addEventListener('click',()=>calcPress(b.dataset.calc))); }
  function calcPress(k){ let c=state.calc; const d=Number(c.display)||0; if(/^\d$/.test(k)||k==='.') { if(c.reset||c.display==='0'){c.display=k==='.'?'0.':k;c.reset=false;} else if(!(k==='.'&&c.display.includes('.'))) c.display+=k; } else if(k==='C'){c.display='0';c.left=null;c.op=null;c.reset=false;} else if(k==='MC'){c.memory=0;} else if(k==='MR'){c.display=String(c.memory);c.reset=true;} else if(k==='M+'){c.memory+=d;c.reset=true;} else if(['+','-','*','/'].includes(k)){ if(c.left!==null&&c.op) computeCalc(); c.left=Number(c.display)||0;c.op=k;c.reset=true; } else if(k==='='){ computeCalc(); c.op=null;c.left=null;c.reset=true; } write(LS.calc,c); renderCalc(); }
  function computeCalc(){ const c=state.calc; const a=Number(c.left)||0,b=Number(c.display)||0; let r=b; if(c.op==='+')r=a+b; if(c.op==='-')r=a-b; if(c.op==='*')r=a*b; if(c.op==='/'){ if(b===0){toast('Cannot divide by zero.'); return;} r=a/b; } c.display=String(Number.isInteger(r)?r:Number(r.toFixed(8))); }
  async function init(){ loadLocal(); if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>null); await initFirebase(); $('calcFab')?.addEventListener('click',()=>{state.calc.open=!state.calc.open;write(LS.calc,state.calc);renderCalc();}); state.ready=true; render(); }
  return {init};
})();
window.addEventListener('DOMContentLoaded',()=>TailorERP.init());
  </script>
